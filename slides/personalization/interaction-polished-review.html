<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>六步流程图 · 校正版预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#17233e;font:16px Arial,"PingFang SC",sans-serif}main{max-width:2048px;margin:auto;padding:22px 24px 30px}header{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin-bottom:18px}h1{font-size:25px;margin:0}header p{font-size:14px;color:#64748b;margin:0}nav{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid #dfe6f1;margin-bottom:18px}button{font:inherit;cursor:pointer;background:none;border:0;border-bottom:3px solid transparent;color:#64748b;padding:9px 1px 12px}button[aria-current="step"]{color:#2449de;border-color:#2449de;font-weight:700}.figure{margin:0;background:white}img{display:block;width:100%;height:auto}footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:18px}#caption{margin:0;font-size:17px}a{color:#2449de;text-decoration:none}a:hover{text-decoration:underline}.links{display:flex;gap:24px;font-size:15px}@media(max-width:800px){main{padding:16px}header{display:block}header p{margin-top:8px}nav{gap:14px}footer{align-items:flex-start;flex-direction:column}.links{flex-wrap:wrap}}
</style>
</head>
<body><main>
<header><h1>六步流程图 · 校正版预览</h1><p>点击步骤，或使用左右方向键切换</p></header>
<nav aria-label="流程步骤"></nav>
<figure class="figure"><img id="figure" alt="交互流程图"></figure>
<footer><p id="caption" aria-live="polite"></p><div class="links"><a id="pdf" target="_blank" rel="noopener">打开当前 PDF</a><a href="figures/interaction-component-master-v2.svg" target="_blank" rel="noopener">打开可编辑母版</a></div></footer>
</main>
<script>
const steps=[['query','提问'],['generation','生成候选'],['selection','选择回答'],['feedback','接收反馈'],['next','下一轮交互'],['collaboration','用户协作']];let selected=5;
const nav=document.querySelector('nav');steps.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=(i+1)+' '+s[1];b.dataset.stage=i+1;b.addEventListener('click',()=>show(i));nav.append(b)});
function show(i){selected=Math.max(0,Math.min(5,i));const stem='figures/interaction-polished-'+String(selected+1).padStart(2,'0')+'-'+steps[selected][0];document.querySelector('#figure').src=stem+'.svg?v=paper-matched-v2';document.querySelector('#figure').alt=steps[selected][1]+'，第'+(selected+1)+'步';document.querySelector('#pdf').href=stem+'.pdf?v=paper-matched-v2#view=FitH';document.querySelector('#caption').textContent=(selected+1)+' / 6  '+steps[selected][1];[...nav.children].forEach((b,n)=>{if(n===selected)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});history.replaceState(null,'','#'+(selected+1))}
window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(selected+(e.key==='ArrowRight'?1:-1))}});show(Number(location.hash.slice(1)||6)-1);
</script></body></html>
